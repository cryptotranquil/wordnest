name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Matches the Flutter revision in .metadata and the committed lockfile.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          lock=$(gzip -c pubspec.lock | base64 -w0)
          index=0
          while [ -n "$lock" ]; do
            echo "::notice title=Resolved lockfile part $index::${lock:0:3000}"
            lock=${lock:3000}
            index=$((index + 1))
          done

      - name: Build release-mode test APK
        shell: bash
        run: |
          set +e
          flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/apk-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # SDK installers use carriage returns for progress. Keep only the
            # end of the log and emit one multiline annotation.
            summary=$(tr '\r' '\n' < "$RUNNER_TEMP/apk-build.log" | tail -n 50)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error::$summary"
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordnest-android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
