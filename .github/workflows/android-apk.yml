name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Matches the Flutter revision in .metadata and the committed lockfile.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release-mode test APK
        shell: bash
        run: |
          set +e
          flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/apk-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Last build log lines"
            tail -n 60 "$RUNNER_TEMP/apk-build.log" | while IFS= read -r line; do
              # GitHub annotations remain available when full job logs cannot be fetched.
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error::$line"
            done
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordnest-android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
