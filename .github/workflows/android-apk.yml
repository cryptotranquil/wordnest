name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Matches the Flutter revision in .metadata and the committed lockfile.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test back navigation
        shell: bash
        run: |
          set +e
          flutter test --no-pub test/back_navigation_test.dart 2>&1 | tee "$RUNNER_TEMP/navigation-test.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tr '\r' '\n' < "$RUNNER_TEMP/navigation-test.log" | tail -n 60)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=Back navigation tests::$summary"
            exit "$status"
          fi

      - name: Build release-mode test APK
        shell: bash
        run: |
          set +e
          flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/apk-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # SDK installers use carriage returns for progress. Keep only the
            # end of the log and emit one multiline annotation.
            summary=$(tr '\r' '\n' < "$RUNNER_TEMP/apk-build.log" | tail -n 50)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error::$summary"
            exit "$status"
          fi

      # Free build JVM memory before starting the emulator on the same runner.
      - name: Stop Gradle daemons
        run: cd android && ./gradlew --stop

      # An APK can compile successfully yet still crash before Flutter starts.
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test app startup on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_smoke_test.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordnest-android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
