<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "error": "#ffb4ab", "on-error": "#690005", "on-primary-fixed": "#00201d", "outline": "#889391", "inverse-surface": "#d3e6eb", "surface-tint": "#80d5cb", "on-surface": "#d3e6eb", "on-tertiary-fixed": "#1e1c12", "surface-variant": "#27373c", "on-primary-fixed-variant": "#00504a", "surface-container": "#112226", "primary-fixed": "#9cf2e8", "background": "#05161a", "surface": "#05161a", "on-secondary-fixed-variant": "#5e4200", "secondary-fixed": "#ffdea8", "surface-dim": "#05161a", "tertiary-fixed-dim": "#ccc6b6", "secondary-container": "#bd8700", "on-secondary-container": "#392600", "surface-container-low": "#0d1e22", "surface-container-high": "#1c2c31", "primary": "#80d5cb", "on-error-container": "#ffdad6", "on-tertiary": "#333025", "primary-container": "#0f766e", "secondary-fixed-dim": "#fabc41", "outline-variant": "#3e4947", "on-tertiary-fixed-variant": "#4a473b", "on-secondary-fixed": "#271900", "primary-fixed-dim": "#80d5cb", "inverse-on-surface": "#223337", "on-primary-container": "a3faef", "inverse-primary": "#006a63", "secondary": "#fabc41", "surface-container-lowest": "#011014", "error-container": "#93000a", "surface-bright": "#2b3c40", "on-secondary": "#422d00", "on-surface-variant": "#bdc9c6", "on-background": "#d3e6eb", "tertiary-container": "#6d695c", "tertiary-fixed": "#e9e2d2", "on-tertiary-container": "#f0e9d9", "tertiary": "#ccc6b6", "surface-container-highest": "#27373c", "on-primary": "#003733" }, "borderRadius": { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, "spacing": { "margin": "1rem", "space-md": "0.75rem", "gutter": "0.75rem", "space-xl": "1.5rem", "space-lg": "1rem", "space-xs": "0.25rem", "space-sm": "0.5rem" }, "fontFamily": { "headline-tile": [ "Quicksand" ], "display-lg-mobile": [ "Quicksand" ], "label-sm": [ "Plus Jakarta Sans" ], "label-md": [ "Plus Jakarta Sans" ], "headline-md": [ "Quicksand" ], "label-lg": [ "Plus Jakarta Sans" ], "body-md": [ "Quicksand" ], "display-lg": [ "Quicksand" ], "body-lg": [ "Quicksand" ], "headline-sm": [ "Quicksand" ] }, "fontSize": { "headline-tile": [ "26px", { "lineHeight": "28px", "fontWeight": "700" } ], "display-lg-mobile": [ "30px", { "lineHeight": "38px", "fontWeight": "700" } ], "label-sm": [ "10px", { "lineHeight": "14px", "fontWeight": "700" } ], "label-md": [ "12px", { "lineHeight": "16px", "fontWeight": "600" } ], "headline-md": [ "22px", { "lineHeight": "28px", "fontWeight": "700" } ], "label-lg": [ "14px", { "lineHeight": "18px", "fontWeight": "700" } ], "body-md": [ "14px", { "lineHeight": "20px", "fontWeight": "500" } ], "display-lg": [ "36px", { "lineHeight": "44px", "fontWeight": "700" } ], "body-lg": [ "16px", { "lineHeight": "22px", "fontWeight": "600" } ], "headline-sm": [ "18px", { "lineHeight": "24px", "fontWeight": "600" } ] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased"><main class="relative min-h-screen w-full bg-surface flex flex-col pt-safe pb-safe"><div class="flex flex-col w-full relative overflow-hidden select-none">
<!-- Atmospheric Background Canvas with Mist & Firefly Glows -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<!-- Scenic Twilight Backdrop Layer -->
<div class="absolute inset-0 bg-cover bg-center opacity-45" data-alt="Serene twilight alpine lake and pine forest shrouded in misty ethereal fog. Deep teal gradient tones, glowing warm twilight horizon with faint mountain silhouettes and subtle amber starlight reflections over still water. Meditative nature escape aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDRCNd4dNCzOHz5M-63mHZpaA1yVH3vrIKiRIU9TAOpAukgIo2MeJP4Xo9Rjktwxx7qaWVr9ionKz4JRbeVXEldXjMqFR2A8VMNbXw9OLhayJiJrT5ad41gZY9FtKu6jNFJtYk10JN2bNiP_ElOKg0Yj4cweDXRmyZAeVTqUJpu3jmGSUaJKA4EoREONS24_fzlK5IephasGCTfnSUaGg_BmYTfMD4tdof13xLCysm1')"></div>
<!-- Calm Vignette Scrim -->
<div class="absolute inset-0 bg-gradient-to-b from-surface/90 via-surface/60 to-surface"></div>
<!-- Soft Golden Halo Centered behind the Nest Emblem -->
<div class="absolute top-[28%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 rounded-full bg-secondary/15 blur-3xl"></div>
<div class="absolute top-[26%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 rounded-full bg-primary/20 blur-2xl"></div>
<!-- Floating Ambient Starlight Fireflies (Animated SVG) -->
<svg class="absolute inset-0 w-full h-full" preserveaspectratio="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="50%" cy="50%" id="firefly-glow" r="50%">
<stop offset="0%" stop-color="#fabc41" stop-opacity="1"></stop>
<stop offset="60%" stop-color="#fabc41" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#fabc41" stop-opacity="0"></stop>
</radialgradient>
</defs>
<!-- Sparkle 1 -->
<circle class="animate-pulse" cx="18%" cy="16%" fill="#fabc41" opacity="0.8" r="2.5"></circle>
<circle cx="18%" cy="16%" fill="url(#firefly-glow)" opacity="0.6" r="7"></circle>
<!-- Sparkle 2 -->
<circle class="animate-ping" cx="82%" cy="19%" fill="#fabc41" opacity="0.9" r="3" style="animation-duration: 4s;"></circle>
<circle cx="82%" cy="19%" fill="url(#firefly-glow)" opacity="0.7" r="9"></circle>
<!-- Sparkle 3 -->
<circle cx="28%" cy="38%" fill="#80d5cb" opacity="0.7" r="1.5"></circle>
<!-- Sparkle 4 -->
<circle class="animate-pulse" cx="86%" cy="58%" fill="#fabc41" opacity="0.85" r="2" style="animation-duration: 3s;"></circle>
<circle cx="86%" cy="58%" fill="url(#firefly-glow)" opacity="0.5" r="6"></circle>
<!-- Sparkle 5 -->
<circle cx="12%" cy="65%" fill="#fabc41" opacity="0.75" r="1.8"></circle>
<!-- Sparkle 6 -->
<circle class="animate-pulse" cx="74%" cy="32%" fill="#80d5cb" opacity="0.8" r="2" style="animation-duration: 5s;"></circle>
</svg>
</div>
<!-- Primary Content Column -->
<div class="relative z-10 flex flex-col justify-between items-center w-full px-margin py-space-lg min-h-[720px]">
<!-- Top Pill: Brand Philosophy Tag -->
<div class="flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container-high/60 backdrop-blur-md shadow-sm">
<span class="material-symbols-outlined text-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="font-label-sm text-label-sm tracking-widest uppercase text-tertiary-fixed">Mindful Word Play</span>
</div>
<!-- Central Hero & Brand Presentation -->
<div class="flex flex-col items-center justify-center w-full my-auto text-center">
<!-- Nest Graphic with Tactile Porcelain Letter Tiles -->
<div class="relative w-64 h-48 flex items-center justify-center">
<!-- Ambient Nest Shadow -->
<div class="absolute bottom-4 w-44 h-8 bg-surface-container-lowest/80 rounded-full blur-md"></div>
<!-- Rendered Image Placeholder for the Core Hero Nest Emblem -->
<div class="relative z-10 w-56 h-44 flex items-center justify-center transition-transform hover:scale-105 duration-700 ease-out">
<img alt="Wordnest handcrafted wooden nest with cream ceramic letter tiles spelling W-O-R-D" class="w-full h-full object-contain filter drop-shadow-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1UdAzgFH98MAzWD3iYB7XpW9icXhF9LxPcLkxYRJQPoMmzdW8jMAENYLdv5NriNBQ8RGzuR6a38C7wMlw-pkDLj-wwmtQX7o2DZZ-0TPdHYiGX1Se0ThVnw_Ppga5bu-a09maAG73aS7O9pXU53KpWGPjc_OVD90asBxtt-7ARDfsgBeDUlz2TlYlQt6fuvjm_cXbpR9eIODQPOuXpO_c-SHu7lfRt-B1gKuiaTuAVClg"/>
</div>
</div>
<!-- Typography Wordmark -->
<div class="flex items-baseline justify-center tracking-wide mt-space-md">
<h1 class="font-display-lg-mobile text-display-lg-mobile font-bold tracking-tight">
<span class="text-tertiary-fixed drop-shadow-md">Word</span><span class="text-secondary drop-shadow-sm">nest</span>
</h1>
<!-- Subtle Zen Stroke Smile Dot -->
<div class="ml-1 mb-1 w-2 h-2 rounded-full bg-secondary shadow-sm shadow-secondary/50"></div>
</div>
<!-- Golden Swipe Horizon Accent Arc -->
<div class="relative flex items-center justify-center w-52 my-space-sm">
<div class="w-full h-[1.5px] bg-gradient-to-r from-transparent via-secondary to-transparent opacity-80"></div>
<div class="absolute right-6 w-2 h-2 rounded-full bg-secondary-fixed shadow-md shadow-secondary animate-pulse"></div>
</div>
<!-- Subtitle Pill -->
<div class="mt-space-xs px-space-md py-1 rounded-full bg-surface-container/70 backdrop-blur-sm shadow-inner">
<span class="font-label-sm text-label-sm tracking-widest text-primary font-bold uppercase">Zen Word Puzzle</span>
</div>
<!-- Poetic Tagline & Sanctuary Meditation Cue -->
<div class="mt-space-lg flex flex-col items-center gap-space-xs max-w-[270px]">
<p class="font-body-lg text-body-lg text-on-surface font-semibold tracking-normal">
          Where words find a peaceful home
        </p>
<p class="font-body-md text-body-md text-on-surface-variant/90 tracking-wide font-medium">
          Breathe in quiet focus.
        </p>
</div>
</div>
<!-- Bottom Action & Boot Loading Flow -->
<div class="w-full max-w-xs flex flex-col items-center gap-space-md pb-space-xs">
<!-- Interactive Entry Button / Progress Indicator -->
<div class="w-full flex flex-col items-center gap-space-sm">
<!-- Golden Luminous Loading Bar Container -->
<div class="w-48 h-1.5 rounded-full bg-surface-container-high/80 overflow-hidden relative shadow-inner">
<div class="h-full bg-gradient-to-r from-secondary-container via-secondary to-primary-fixed rounded-full w-2/5 transition-all duration-500 ease-out shadow-sm shadow-secondary/50" id="boot-progress"></div>
</div>
<!-- Dynamic Status Message & Breathing Pulsing Dots -->
<div class="flex items-center gap-space-xs mt-1">
<div class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 0ms;"></span>
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 180ms;"></span>
<span class="w-1.5 h-1.5 rounded-full bg-secondary animate-bounce" style="animation-delay: 360ms;"></span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant font-medium ml-1" id="boot-status">Entering the sanctuary…</span>
</div>
</div>
<!-- Tactile Micro-interaction: Tap to Begin Pill Button -->
<button class="w-full py-space-sm px-space-lg rounded-full bg-primary-container hover:bg-primary-container/90 active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm shadow-lg shadow-surface-container-lowest/50 group" id="enter-button">
<span class="font-label-lg text-label-lg text-on-primary-container font-bold tracking-wide">Enter Sanctuary</span>
<span class="material-symbols-outlined text-on-primary-container text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<!-- Soft Version and Build Footprint -->
<div class="flex items-center justify-center gap-space-xs opacity-60">
<span class="material-symbols-outlined text-[12px] text-tertiary">nest_farsight_weather</span>
<span class="font-label-sm text-label-sm text-tertiary">v1.0.0 • Zen Wordnest</span>
</div>
</div>
</div>
</div>
<script>
  // Soft ambient boot sequence simulator
  (function() {
    const progressBar = document.getElementById('boot-progress');
    const statusText = document.getElementById('boot-status');
    const enterBtn = document.getElementById('enter-button');

    const bootSteps = [
      { width: '45%', text: 'Tuning nature sounds…' },
      { width: '75%', text: 'Preparing letter tiles…' },
      { width: '100%', text: 'Nest is ready.' }
    ];

    let currentStep = 0;
    const interval = setInterval(() => {
      if (currentStep < bootSteps.length) {
        if (progressBar) progressBar.style.width = bootSteps[currentStep].width;
        if (statusText) statusText.textContent = bootSteps[currentStep].text;
        currentStep++;
      } else {
        clearInterval(interval);
        if (enterBtn) {
          enterBtn.classList.add('ring-2', 'ring-secondary/50', 'animate-pulse');
        }
      }
    }, 1100);

    if (enterBtn) {
      enterBtn.addEventListener('click', () => {
        enterBtn.classList.remove('animate-pulse');
        if (statusText) statusText.textContent = 'Welcome home…';
        enterBtn.innerHTML = '<span class="font-label-lg text-label-lg text-on-primary-container font-bold">Unwinding…</span>';
      });
    }
  })();
</script></main></body></html>
