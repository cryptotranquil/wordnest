<script>
  (function() {
    const shuffleBtn = document.getElementById('shuffle-btn');
    const nodes = document.querySelectorAll('.letter-node');
    const streamerWord = document.getElementById('active-spelled-word');

    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', () => {
        nodes.forEach(node => {
          node.classList.add('rotate-[360deg]', 'scale-90');
          setTimeout(() => {
            node.classList.remove('rotate-[360deg]', 'scale-90');
          }, 350);
        });
      });
    }

    nodes.forEach(node => {
      node.addEventListener('click', () => {
        const letter = node.getAttribute('data-letter');
        if (streamerWord && letter) {
          const currentText = streamerWord.textContent.replace(/\s+/g, '').replace(/·/g, '');
          if (currentText.length < 5) {
            const nextWord = (currentText + letter).split('').join(' · ');
            streamerWord.textContent = nextWord;
          }
        }
      });
    });
  })();
