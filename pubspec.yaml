name: wordnest
description: "Wordnest — a calm word-cross puzzle."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.1.12
  shared_preferences: ^2.3.2
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^23.0.0
  collection: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/sfx/
    - assets/audio/music/

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf